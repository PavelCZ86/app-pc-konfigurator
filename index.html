<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: workbench — parts catalog | antistatic mat with the open case | build sheet */
:root{
  /* single committed look: blue-black workshop */
  --bg:#0b1628; --panel:rgba(26,43,72,.85); --panel-2:#1f3150; --ink:#eaf1fa; --muted:#a2b5cf; --line:#2f4670;
  --accent:#5b8cff; --accent-ink:#ffffff; --accent-soft:#1a2b4f;
  --ok:#5fcf8f; --ok-soft:#12301f; --warn:#e9b85e; --warn-soft:#33270f; --err:#f2786d; --err-soft:#3a1a18;
  --mat:#3f5268; --mat-grid:rgba(200,220,255,.08); --mat-ink:rgba(255,255,255,.78);
  --slot-line:rgba(255,255,255,.55); --slot-fill:rgba(255,255,255,.07); --slot-text:rgba(255,255,255,.88); --hot:#ffd166;
  --thumb:#16243a; --danger:#e5484d; --danger-ink:#ffffff;
  --f-display:'Chakra Petch','Segoe UI',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0}
body{background-color:var(--bg);background-image:radial-gradient(900px 520px at 12% -8%,rgba(70,124,232,.42),transparent 70%),radial-gradient(800px 600px at 95% 110%,rgba(46,94,190,.34),transparent 70%),linear-gradient(165deg,#17325f 0%,#0f2143 45%,#081226 100%);background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;
  display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"brand totals";align-items:center;gap:4px 20px;padding-block:0 12px}
.brand{grid-area:brand;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;min-width:0}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:38px;letter-spacing:.03em;margin:0;line-height:.95;padding:0 4px 2px}
.brand h1 .glow{display:inline-block;transform:scaleX(1.08);transform-origin:center}
/* neon chrome title: cyan-to-magenta fill with a bright split line, light rim, dark extrusion and soft glow */
.brand h1 .glow{
  background:linear-gradient(180deg,#5f89f5 0%,#4a72e4 50%,#7b67de 50%,#6352c4 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 1px 0 #4a3ca6) drop-shadow(0 1px 0 #43369a) drop-shadow(0 1px 0 #3d318a)}
.brand h1 span:not(.glow){color:inherit}
.brand p{margin:0;color:var(--muted);font-size:15.5px;line-height:1.2}
.totals{grid-area:totals;justify-self:end;max-width:380px;display:flex;align-items:center;gap:3px 14px;flex-wrap:wrap;justify-content:flex-end}
.stat{display:flex;flex-direction:column;gap:0}
.stat small{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat b{font-family:var(--f-display);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12.5px;font-weight:600}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.err{background:var(--err-soft);color:var(--err)}
.hbtns{display:flex;gap:6px;flex-basis:100%;justify-content:flex-end}
.hbtns .btn{padding:3px 10px;font-size:12px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:500}
.btn:hover{filter:brightness(1.1)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
#bClear{background:#ffffff;color:#14181f;border-color:#ffffff}
#bClear:hover{background:#e9edf3;filter:none}
.btn.danger{background:var(--danger);border-color:var(--danger);color:var(--danger-ink);font-weight:600}
.btn.danger:hover{filter:brightness(1.1)}
.segs{flex:none;display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.seg{display:flex;flex-wrap:wrap;gap:4px;padding:3px;background:#2e3f68;border:1px solid #4a5f92;border-radius:9px}
.seg button{flex:1 0 auto;white-space:nowrap;border:0;background:none;border-radius:6px;padding:5px 5px;font-size:12px;font-weight:500;color:#dbe4f5;display:flex;justify-content:center;gap:5px}
.seg button span{font-variant-numeric:tabular-nums;opacity:.7}
.seg button:hover{background:rgba(255,255,255,.08)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.empty-list{padding:18px 14px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:13px;text-align:center}

main.app{flex:1;min-height:0;display:grid;gap:0 16px;padding-block:12px 16px;
  grid-template-columns:minmax(330px,380px) minmax(0,1fr) minmax(280px,330px);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"cat head head" "cat stage sum"}
header.top{grid-area:head}
.col{min-height:0;min-width:0;display:flex;flex-direction:column}
.cat{grid-area:cat} .stagecol{grid-area:stage} .sum{grid-area:sum}

/* catalog */
.tabs{flex:none;display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:3px 3px 10px;scrollbar-width:thin}
.cathead,.segs{flex:none}
.tab{flex:none;border:1px solid #5a4db0;background:#3d318a;color:#fff;border-radius:8px;padding:12px 14px;font-size:13px;font-weight:500;line-height:1.2;display:flex;align-items:center;gap:6px;white-space:nowrap}
.tab .dot{flex:none}
.tab:hover{filter:brightness(1.1)}
.tab .dot{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--muted)}
.tab .dot.on{background:var(--ok);border-color:var(--ok)}
.tab[aria-selected="true"]{background:#3d318a;color:#fff;border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.35);font-weight:600}
.tab[aria-selected="true"] .dot{border-color:#fff}
.tab .dot{border-color:rgba(255,255,255,.85)}
.cathead{display:flex;justify-content:space-between;align-items:baseline;margin:2px 2px 8px}
.cathead h2{font-family:var(--f-display);font-size:17px;font-weight:600;margin:0}
.cathead span{font-size:12px;color:var(--muted)}
.list{overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-right:2px;min-height:0}
.card{display:grid;grid-template-columns:108px minmax(0,1fr);gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:grab;transition:border-color .15s, transform .15s}
.card:hover{border-color:var(--accent)}
/* lighter blue cards in the catalog */
.card{background:linear-gradient(180deg,#3563a8,#2c5596);border-color:rgba(170,200,255,.35)}
.card:hover{border-color:#cfe0ff}
.card .code,.card .chips li{color:#d7e4f8}
.card .chips li{background:rgba(255,255,255,.14)}
.card .sold{color:#d9e7ff}
.card .rank{color:rgba(255,255,255,.85)}
.card .btn.primary{background:#1550d8;border-color:rgba(255,255,255,.55)}
.card .btn:not(.primary):not(.danger){background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#fff}

.price{font-family:var(--f-display);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;margin-right:auto}

.flag.err{background:var(--err-soft);color:var(--err)} .flag.warn{background:var(--warn-soft);color:var(--warn)} .flag.in{background:var(--ok-soft);color:var(--ok)}

/* stage */
.stage{position:relative;flex:1;min-height:0;border-radius:14px;border:1px solid rgba(180,205,240,.18);background-color:var(--mat);
  background-image:linear-gradient(var(--mat-grid) 1px,transparent 1px),linear-gradient(90deg,var(--mat-grid) 1px,transparent 1px);

.stage > canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.stage .mathint{position:absolute;left:14px;right:14px;bottom:10px;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.5)}
h1 .ttl{position:relative;display:inline-block}
h1 .beta{position:absolute;left:100%;top:.55em;margin-left:.9em;white-space:nowrap;line-height:1;padding:.2em .55em;border-radius:999px;font-family:"IBM Plex Sans",sans-serif;font-size:.3em;font-weight:600;letter-spacing:.08em;text-transform:uppercase;vertical-align:baseline;color:#ffcf8a;background:rgba(255,154,46,.14);border:1px solid rgba(255,154,46,.55);-webkit-text-fill-color:#ffcf8a}
.zbox{position:absolute;left:10px;top:10px;display:flex;align-items:center;gap:5px;z-index:2;font-family:"Share Tech Mono",ui-monospace,monospace;letter-spacing:.06em}
.zval,.zreset,.zstep{font:inherit;font-size:11px;line-height:1;padding:5px 7px;border-radius:5px;font-variant-numeric:tabular-nums;text-transform:uppercase}
.zstep{cursor:pointer;min-width:26px;font-size:14px;font-weight:700;background:#06120b;border:1px solid #1f5a34;color:#3dff7d;text-shadow:0 0 5px rgba(61,255,125,.35)}
.zstep:hover{background:#0c2a17;border-color:#3dff7d}
.zval{min-width:15ch;text-align:right;background:#06120b;border:1px solid #1f5a34;color:#3dff7d;text-shadow:0 0 5px rgba(61,255,125,.35);box-shadow:inset 0 0 8px rgba(0,0,0,.6)}
.btn.tower{background:#2a2350;color:#d9d2ff;border:1px solid #6b5bd6}
.btn.tower:hover{background:#3a3070}
.btn.pwr{background:#123a24;color:#7dffa8;border:1px solid #2f8f55}

.btn.pwr.on{background:#2fae62;color:#04140a;border-color:#7dffa8;box-shadow:0 0 12px rgba(61,255,125,.35)}
.zreset{cursor:pointer;background:#1a0d02;border:1px solid #8a4a10;color:#ff9a2e;text-shadow:0 0 5px rgba(255,154,46,.35)}
.zreset:hover:not(:disabled){background:#2e1704;border-color:#ff9a2e}
.zreset:disabled{color:#8a5320;border-color:#4d2a08;text-shadow:none;cursor:default}
.monchip{position:absolute;right:12px;top:12px;z-index:2;width:162px;padding:9px 9px 8px;border-radius:12px;background:var(--thumb);border:1px solid rgba(160,190,230,.25);box-shadow:0 6px 18px rgba(0,0,0,.35);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font:inherit}
.monchip[hidden]{display:none}
.monchip svg{width:100%;height:108px}
.monchip .mname{font-size:11.5px;line-height:1.3;font-weight:600;color:#e3ecf8;text-align:center}
.monchip:hover{border-color:#8fb4ff}
.b3bar{position:absolute;right:12px;top:12px;display:flex;align-items:center;gap:12px}
.stage:has(.monchip:not([hidden])) .b3bar{right:186px}  /* the case button moves left of the monitor picture */
.b3pow{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--mat-ink)}
.b3pow i{width:9px;height:9px;border-radius:50%;background:#465670}
.b3pow.on{color:var(--ok)}
.b3pow.on i{background:var(--ok);box-shadow:0 0 10px var(--ok)}
[hidden]{display:none!important}
.mathint{align-self:stretch;font-size:12.5px;color:var(--mat-ink)}
@media (max-width:860px){ .ux .uxhint{display:none} }
.ghost{fill:var(--slot-fill);stroke:var(--slot-line);stroke-width:1.5;stroke-dasharray:6 5}
.ghost-t{fill:var(--slot-text);font-family:var(--f-body);font-size:13px;font-weight:500;pointer-events:none}
.zone{cursor:pointer}
.zone-hit{fill:transparent;stroke:none}
.zone.filled{cursor:grab;touch-action:none}
.zone.lifted{opacity:.25}
.drag-ghost{position:fixed;left:0;top:0;z-index:50;pointer-events:none;filter:drop-shadow(0 12px 18px rgba(0,0,0,.4))}
.drag-ghost svg{width:100%;height:100%;display:block}
.drag-ghost .tag{position:absolute;left:50%;top:-30px;transform:translateX(-50%);background:var(--danger);color:var(--danger-ink);font-size:12px;font-weight:600;padding:3px 9px;border-radius:6px;white-space:nowrap;display:none}
.drag-ghost.out .tag{display:block}
.drag-ghost.out svg{opacity:.8}
body.dragging-part,body.dragging-part *{cursor:grabbing!important;user-select:none}
.zone:hover .zone-hit,.zone:focus-visible .zone-hit{stroke:rgba(255,255,255,.6);stroke-width:2}
.zone.hot .zone-hit{stroke:var(--hot);stroke-width:4;stroke-dasharray:10 6;animation:march 1s linear infinite}
.zone.hot .ghost{fill:rgba(255,209,102,.16)}
.zone.deny .zone-hit{stroke:var(--danger);stroke-width:4;stroke-dasharray:10 6}
.stage.deny{box-shadow:inset 0 0 0 3px var(--danger)}
.toast{position:fixed;left:50%;top:96px;transform:translateX(-50%);z-index:5;background:var(--danger);color:var(--danger-ink);padding:8px 14px;border-radius:8px;font-weight:600;font-size:13px;width:max-content;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.card.is-blocked .thumb{opacity:.5}
.btn:disabled{opacity:.65;cursor:not-allowed}
.btn:disabled:hover{border-color:var(--line)}
.zone:focus{outline:none}
.pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1);transform-box:fill-box;transform-origin:center}
@keyframes pop{from{transform:translateY(-14px) scale(.96);opacity:.3}to{transform:none;opacity:1}}
@keyframes march{to{stroke-dashoffset:-32}}

/* summary */
.sheet{background:var(--panel);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:0;overflow-y:auto}

.parts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}

.parts .nm .code{display:block}
.parts .pr{font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
.parts .empty{color:var(--muted);font-style:italic;font-size:13px}
.x{border:0;background:none;color:var(--muted);width:26px;height:26px;border-radius:6px;font-size:16px;line-height:1}
.x:hover{background:var(--err-soft);color:var(--err)}
.link{border:0;background:none;color:var(--accent);font-size:12.5px;font-weight:500;padding:2px 4px}
.sumtotal{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;padding-top:6px;border-top:2px solid var(--ink)}
.sumtotal b{font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.meter{height:8px;border-radius:4px;background:var(--panel-2);overflow:hidden;margin:6px 0 3px}
.meter i{display:block;height:100%;border-radius:5px;transition:width .3s}
.mnote{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.parts .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.perf{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.perf li{display:grid;grid-template-columns:112px minmax(0,1fr) 42px;gap:8px;align-items:center;font-size:12px;line-height:1.5}
.perf .pl{color:var(--ink)}
.perf .pv{grid-column:3;grid-row:1;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:600}
.perf .pb{grid-column:2;grid-row:1;height:8px;border-radius:4px;background:var(--panel-2);overflow:hidden}
.perf .pb i{display:block;height:100%;border-radius:4px;transition:width .35s}
.perf .empty{color:var(--muted);font-size:12.5px}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.checks li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px;font-size:13px;align-items:start}
.checks .ic{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;margin-top:1px}
.checks .ok .ic{background:var(--ok-soft);color:var(--ok)} .checks .warn .ic{background:var(--warn-soft);color:var(--warn)} .checks .err .ic{background:var(--err-soft);color:var(--err)}
.checks .todo .ic{background:var(--panel-2);color:var(--muted)}
.note{font-size:11.5px;color:var(--muted);margin:0}

@media (max-width:0px){

}

  .tab{padding:10px 12px}

    padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
    background:rgba(11,22,40,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line)}

/* ===== UX prototype: big mat in the middle, category tiles underneath, catalog as a drawer, build on the right ===== */
body{background:#0f1720;background-image:none}
main.app.ux{grid-template-columns:minmax(0,1fr) minmax(300px,340px);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"head head" "stage sum" "tray sum";gap:12px 16px}
.ux .stagecol{grid-area:stage;position:relative;min-height:0}
.ux .stage{background:#131e2b;background-image:none;border-color:#223246}
.ux .sum{grid-area:sum}
.ux .tray{grid-area:tray;min-width:0}
.ux .tabs{display:flex;gap:12px;justify-content:center;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;padding:4px 4px 6px;border:0;background:none;position:static}
.ux .tab{flex:none;width:104px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px 8px;border-radius:14px;
  background:#1c2735;border:1px solid #3f8f63;color:#e6edf6;white-space:normal;line-height:1.15;transition:transform .15s,border-color .15s,background .15s}
.ux .tab:hover{transform:translateY(-2px);border-color:#5fc58a;filter:none}
.ux .tab[aria-selected="true"]{background:#243250;border-color:#6fdc9c;box-shadow:0 0 0 2px rgba(111,220,156,.3);font-weight:500}
.ux .tab.open{background:#2c3d63;border-color:#6fdc9c}
.ux .tab.filled{border-color:#3f8f63}
.ux .tab .ic{width:64px;height:46px;display:block}
.ux .tab .tl{font-size:12.5px;font-weight:600;text-align:center}
.ux .tab .tv{display:block;font-size:10.5px;color:#93a6bf;text-align:center;max-width:96px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ux .tab.filled .tv{color:#7fdca6}
.ux .tab .dot{display:none}
.drawer{position:absolute;left:10px;right:10px;bottom:10px;height:min(62%,520px);z-index:8;background:rgba(19,29,43,.97);backdrop-filter:blur(8px);
  border:1px solid #2e4060;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 18px 40px rgba(0,0,0,.45);
  transform:translateY(calc(100% + 20px));opacity:0;pointer-events:none;transition:transform .28s cubic-bezier(.2,.9,.3,1),opacity .2s}
.drawer.open{transform:none;opacity:1;pointer-events:auto}
.drawer.open.peek{opacity:.1;pointer-events:none;transition:opacity .15s}
.drawer .cathead{display:flex;align-items:center;gap:10px;margin:0}
.drawer .cathead span{margin-left:auto}
.dclose{border:1px solid #3a4c6a;background:#22304a;color:#fff;width:30px;height:30px;border-radius:8px;font-size:18px;line-height:1}
.dclose:hover{border-color:#5b8cff}
.drawer .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px;overflow-y:auto;align-content:start;padding-right:4px}
.drawer .segs{margin:0}
@media (prefers-reduced-motion:reduce){ .drawer{transition:none} .ux .tab{transition:none} }
/* desktop: the catalog opens as a full-height column on the left; mat and category tiles move right */
@media (min-width:861px){
  main.app.ux{grid-template-columns:auto minmax(0,1fr) minmax(300px,340px);grid-template-areas:"cat head head" "cat stage sum" "cat tray sum";column-gap:0}
  .ux .dclose{display:none}
  /* summary: one line per part (label | name | price | ×) so the right column fits without scrolling */
  .ux .parts li{grid-template-columns:92px minmax(0,1fr) auto auto;gap:6px;padding:2px 0;min-height:30px}
  .ux .parts .lbl{grid-column:auto;font-size:9.5px;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ux .parts .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
  .ux .parts .pr,.ux .parts .empty{font-size:12.5px}
  .ux .stagetop{grid-area:stage;align-self:start;justify-self:end;transform:translateY(calc(-100% - 2px));z-index:3}
  .ux .stagetop .btn{padding:3px 10px;font-size:12px} /* same size as it was in the header */
  .ux .uxhint{grid-area:stage;align-self:start;justify-self:end;transform:translateY(calc(-100% - 7px));pointer-events:none;font-size:12px;color:#9fb3cc;white-space:nowrap}
  .ux .sum{margin-left:16px}
  .ux .drawer{grid-area:cat;position:static;width:0;height:auto;padding:0;border-width:0;opacity:1;transform:none;transition:none;display:none;box-shadow:none;background:#162231;min-height:0;margin-right:12px}

  .drawer .list{grid-template-columns:minmax(0,1fr)}
  .totals{justify-self:center}
}

<body>



<main class="app ux">
<header class="top">
  <div class="brand">
    <h1><span class="ttl"><span class="glow">PC Konfigurátor</span><sup class="beta">beta</sup></span></h1>
    <p><span class="dt">Sestav si svoje vysněné PC. Přetáhni díly z menu na podložku a skládej počítač.</span><span class="mo">Sestav si svoje vysněné PC. Vyber díly z menu a skládej počítač.</span></p>
  </div>
  <div class="totals">
    <div class="stat"><small>Cena sestavy</small><b id="tPrice">0 Kč</b></div>
    <div class="stat"><small>Odběr</small><b id="tWatt">0 W</b></div>
    <span id="tStatus" class="pill ok">—</span>

/* ---------- drawings ---------- */
function fan(cx,cy,r,blade,frame){
  let s=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${frame}"/><circle cx="${cx}" cy="${cy}" r="${r-2}" fill="#0f1114"/>`;
  const by=(cy-r*0.52).toFixed(1);
  for(let i=0;i<7;i++) s+=`<ellipse cx="${cx}" cy="${by}" rx="${(r*0.2).toFixed(1)}" ry="${(r*0.4).toFixed(1)}" fill="${blade}" transform="rotate(${(i*51.43).toFixed(1)} ${cx} ${cy}) rotate(24 ${cx} ${by})"/>`;
  s+=`<circle cx="${cx}" cy="${cy}" r="${(r*0.3).toFixed(1)}" fill="#24282e"/><circle cx="${cx}" cy="${cy}" r="${(r*0.12).toFixed(1)}" fill="${blade}"/>`;
  return s;
}
function cpuDraw(p){

  for(let k=0;k<11;k++){const x=8+k*8;s+=`<rect x="${x}" y="6" width="3" height="2" fill="${GOLD}"/><rect x="${x}" y="92" width="3" height="2" fill="${GOLD}"/>`;}
  s+=`<rect x="15" y="15" width="70" height="70" rx="7" fill="#b7bec7"/><rect x="18" y="18" width="64" height="64" rx="5" fill="#d3d8de"/>`;

}

function lift(hex){const n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255,c=(v,a)=>Math.min(255,v+a).toString(16).padStart(2,'0');return '#'+c(r,26)+c(g,36)+c(b,52);}

// rough draw of the parts actually placed; nothing placed = 0 W
function estimate(b){ let w=0;
  if(b.mb) w+=b.mb.form==="ITX"?15:30;   // board, chipset, USB
  if(b.cpu) w+=b.cpu.tdp;
  if(b.gpu) w+=b.gpu.tdp;
  if(b.ram) w+=5*(ramMods()||1);          // about 5 W per module
  if(b.ssd) w+=b.ssd.form==='35'?8:b.ssd.form==='25'?3:6;
  if(b.cooler) w+=b.cooler.aio?10:4;
  if(b.case) w+=b.case.psuBuilt?0:8;   // case fans
  return w; }
const recPSU=e=>Math.ceil(e*1.3/50)*50;
function checks(b){
  const o=[], add=(level,text,cats,short,block)=>o.push({level,text,cats,short,block});
  const {cpu,mb,ram,gpu,cooler}=b, cs=b.case, psu=effPsu(b);
  if(cs&&cs.psuBuilt&&b.psu) add('err',`Skříň má vlastní zdroj ${cs.psuBuilt} W, jiný zdroj se do ní nevejde`,['psu','case'],'Vlastní zdroj',true);
  if(cpu&&mb) cpu.socket===mb.socket?add('ok',`Patice ${cpu.socket} sedí`,['cpu','mb']):add('err',`Procesor má patici ${cpu.socket}, deska ${mb.socket}`,['cpu','mb'],'Jiná patice',true);
  if(ram&&mb) ram.type===mb.ram?add('ok',`Paměť ${ram.type} sedí do desky`,['ram','mb']):add('err',`Deska bere ${mb.ram}, paměť je ${ram.type}`,['ram','mb'],`Deska chce ${mb.ram}`,true);
  if(mb&&cs) cs.forms.includes(mb.form)?add('ok',`Deska ${mb.form} se vejde do skříně`,['mb','case']):add('err',`Skříň pojme jen ${cs.forms.join(', ')}, deska je ${mb.form}`,['mb','case'],'Nevejde se',true);
  if(gpu&&cs&&!cs.gpuMax) add('err','Skříň nemá místo pro grafickou kartu',['gpu','case'],'Bez místa',true);
  else if(gpu&&cs) gpu.len<=cs.gpuMax?add('ok',`Grafika ${gpu.len} mm, místo ${cs.gpuMax} mm`,['gpu','case']):add('err',`Grafika má ${gpu.len} mm, skříň pojme ${cs.gpuMax} mm`,['gpu','case'],'Moc dlouhá',true);
  if(cooler&&cs) cooler.height<=cs.coolerMax?add('ok',`Chladič ${cooler.height} mm, místo ${cs.coolerMax} mm`,['cooler','case']):add('err',`Chladič má ${cooler.height} mm, skříň pojme ${cs.coolerMax} mm`,['cooler','case'],'Moc vysoký',true);
  if(cooler&&cpu){
    if(!cooler.sockets.includes(cpu.socket)) add('err',`Chladič nepodporuje patici ${cpu.socket}`,['cooler','cpu'],'Jiná patice',true);
    else if(cpu.tdp>cooler.tdpMax) add('warn',`Chladič uchladí ${cooler.tdpMax} W, procesor má ${cpu.tdp} W`,['cooler','cpu'],'Slabý chladič');
    else add('ok',`Chladič zvládne ${cpu.tdp} W procesoru`,['cooler','cpu']);
  }
  if(cs&&cpu&&cpu.boxCooler&&!cooler&&cs.coolerMax<55) add('warn',`Přibalený chladič procesoru je na tuto skříň moc vysoký (max. ${cs.coolerMax} mm), vyber nízký chladič`,['cooler','case','cpu'],'Nízká skříň');
  if(cpu&&!cpu.igpu&&!gpu) add('err','Procesor nemá integrovanou grafiku, bez grafické karty nebude obraz',['cpu'],'Chce grafiku');
  if(psu){ const e=estimate(b), r=recPSU(e);
    if(psu.watt<e) add('err',`Zdroj ${psu.watt} W nestačí na odběr ≈ ${e} W`,['psu','gpu','cpu'],'Slabý zdroj');
    else if(psu.watt<r) add('warn',`Zdroj ${psu.watt} W je na hraně, doporučeno ${r} W`,['psu','gpu','cpu'],'Zdroj na hraně');
    else add('ok',`Zdroj ${psu.watt} W stačí (doporučeno ${r} W)`,['psu']);
  }
  return o;
}

  const b=parts(build); b[p.cat]=p;
  const list=checks(b).filter(c=>c.level!=='ok'&&c.short!=='Chce grafiku'&&c.cats.includes(p.cat));
  return list.find(c=>c.level==='err')||list[0]||null;
}

const GPU_SCORE=[[/RTX 5090/,100],[/RTX 5080/,80],[/RTX 5070 Ti/,70],[/RX 9070 XT/,68],[/RX 7900 XT/,64],[/RX 9070 GRE/,48],[/RX 9070/,58],[/RTX 5070/,56],
  [/RTX 5060 Ti.*16/,43],[/RTX 5060 Ti/,40],[/RX 9060 XT/,40],[/RTX 5060/,34],[/RTX 5050/,26],[/RX 7600/,28],[/RTX 3050/,15]];
function gpuScore(b){
  if(b.gpu){const n=b.gpu.name; for(const [re,v] of GPU_SCORE) if(re.test(n)) return v; return 30;}
  if(!b.cpu||!b.cpu.igpu) return 0;
  const n=b.cpu.name;                       // integrated graphics
  if(/8600G|8700G/.test(n)) return 9; if(/5700G|5600G/.test(n)) return 6; if(/3200G|3400G/.test(n)) return 4;
  return 3;
}
function cpuScores(c){
  if(!c) return {game:0,multi:0};
  const n=c.name, cores=+((c.spec.join(' ').match(/(\d+) j[aá]d/)||[])[1]||6);
  let gen=.7, m;
  if((m=n.match(/Ryzen \d (\d)\d{3}/))) gen={9:1,8:.86,7:.9,5:.72,3:.5}[m[1]]||.7;
  else if(/Core Ultra/.test(n)) gen=.95;
  else if((m=n.match(/Core i\d-(\d\d)/))) gen=+m[1]>=14?.9:.8;
  const x3d=/X3D/.test(n)?1.15:1;
  return {game:Math.min(100,Math.round(gen*x3d*Math.min(1,.72+cores/40)*100/1.15)), multi:Math.min(100,Math.round(Math.sqrt(gen*Math.min(cores,24)/16)*100))};
}
function renderPerf(b){

  if(!b.cpu){ el.innerHTML='<li class="empty">Vlož procesor (a grafiku) a uvidíš, na co sestava stačí.</li>'; note.textContent=''; return; }
  const c=cpuScores(b.cpu), g=gpuScore(b), gb=b.ram?(+((b.ram.name.match(/(\d+)\s?GB/)||[])[1]||16))/b.ram.sticks*ramMods():0;
  const ramS=gb>=64?100:gb>=32?85:gb>=16?55:gb?30:0, cf=Math.min(1,.55+c.game/220), cl=v=>Math.max(0,Math.min(100,Math.round(v)));
  const rows=[
    ['Kancelář a internet', g?cl(72+c.game*.32)*(gb?1:.5):0],
    ['Hry ve Full HD',      cl(g/38*100*cf)],
    ['Hry ve 1440p a 4K',   cl(g/72*100*cf)],
    ['Střih videa',         cl(c.multi*.6+Math.min(g,60)/60*25+ramS*.15)],
    ['Streamování',         cl(c.multi*.5+Math.min(g,56)/56*35+ramS*.15)]
  ];
  const col=v=>v>=70?'var(--ok)':v>=40?'var(--warn)':'var(--err)';
  el.innerHTML=rows.map(([l,v])=>`<li><span class="pl">${l}</span><span class="pv">${v} %</span><span class="pb"><i style="width:${v}%;background:${col(v)}"></i></span></li>`).join('');

}

    sun.target.position.copy(view.t); sun.position.copy(view.t).add(new THREE.Vector3(40,110,70));
  }
  function resize(){ const w=host.clientWidth, h=host.clientHeight; if(!w||!h) return; R.setSize(w,h,false); fit(); }
  new ResizeObserver(resize).observe(host);

  /* ---- interaction: rotate, zoom, click a part, drag a part out ---- */
  const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
  function pick(e){ const r=canvas.getBoundingClientRect(); ndc.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1); ray.setFromCamera(ndc,cam);
    const list=[]; for(const o of Object.values(objs)) o.g.traverse(m=>{ if(m.isMesh&&m.visible&&m!==(objs.case&&objs.case.g.userData.lid)) list.push(m); });
    const hits=ray.intersectObjects(list,false); if(!hits.length) return null;
    const inner=!assembled&&hits.find(h=>h.object.userData.cat!=='case'); // see-through case: grab what is inside it
    return (inner||hits[0]).object.userData.cat; }
  const ground=new THREE.Plane(new THREE.Vector3(0,1,0),0), gp=new THREE.Vector3();
  function offMat(e){ const r=canvas.getBoundingClientRect();
    if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom) return true;
    ndc.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1); ray.setFromCamera(ndc,cam);
    if(!ray.ray.intersectPlane(ground,gp)) return true;
    return gp.x<matRect.x0||gp.x>matRect.x1||gp.z<matRect.z0||gp.z>matRect.z1; }
  let flashT=null;
  function flash(cat){ const gs=Object.values(objs).filter(o=>o.cat===cat).map(o=>o.g);
    gs.forEach(g=>g.traverse(m=>{ if(m.isMesh&&m.material.emissive&&!glows.includes(m)){ m.userData.em=m.userData.em||m.material.emissive.clone(); m.material.emissive.setHex(0x2a4a8a); } }));
    clearTimeout(flashT); flashT=setTimeout(()=>gs.forEach(g=>g.traverse(m=>{ if(m.isMesh&&m.userData.em) m.material.emissive.copy(m.userData.em); })),700); }
  let drag=null;
  canvas.addEventListener('pointerdown',e=>{ if(e.button>0) return; const cat=pick(e);
    drag={x:e.clientX,y:e.clientY,t:theta,p:phi,cat,id:cat&&cat==='cooler'&&!build.cooler?(build.cpu||null):(cat&&build[cat]) /* boxed cooler: dragging it takes the CPU (with its cooler) out */,moved:false,ghost:null}; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove',e=>{
    if(!drag){ const c=pick(e); canvas.style.cursor='grab'; return; }
    const dx=e.clientX-drag.x, dy=e.clientY-drag.y; if(!drag.moved&&Math.hypot(dx,dy)>6) drag.moved=true; if(!drag.moved) return;
    if(drag.id){ // pulling a part off the bench
      if(!drag.ghost){ const g=document.createElement('div'); g.className='drag-ghost'; g.style.width='150px'; g.style.height='110px'; g.innerHTML=thumb(BY[drag.id])+'<span class="tag">Pustit = vyjmout</span>'; document.body.appendChild(g); drag.ghost=g; document.body.classList.add('dragging-part'); }
      drag.ghost.style.transform=`translate(${e.clientX-75}px,${e.clientY-55}px)`;
      const out=offMat(e); drag.ghost.classList.toggle('out',out); drag.out=out; return; }
    // free orbit in all directions around a fixed pivot (size locked, so the mat never stretches)
    zreset.disabled=false; theta=drag.t-dx*.008; phi=THREE.MathUtils.clamp(drag.p+dy*.006,THREE.MathUtils.degToRad(4),THREE.MathUtils.degToRad(89)); orbit=true; canvas.style.cursor='grabbing'; fit(); });
  function endDrag(e){ const d=drag; drag=null; if(!d) return;
    if(d.ghost){ d.ghost.remove(); document.body.classList.remove('dragging-part'); if(d.out&&e.type==='pointerup') remove(d.id); return; }
    if(!d.moved&&e.type==='pointerup'&&d.cat){ flash(d.cat); setTab(d.cat==='case'?'case':d.cat,true); } }
  canvas.addEventListener('pointerup',endDrag); canvas.addEventListener('pointercancel',endDrag);
  canvas.addEventListener('wheel',e=>{ e.preventDefault(); zoomSet(zoom*Math.exp(-THREE.MathUtils.clamp(e.deltaY,-60,60)*.0025)); /* gentle, proportional to the scroll */ },{passive:false});
  canvas.addEventListener('dblclick',()=>resetView());
  $('b3Asm').addEventListener('click',()=>{ assembled=!assembled; lastSig=JSON.stringify([build,ramMods()]); sync(); });
  $('b3Tower').addEventListener('click',()=>{ tower=!tower; orbit=false; sync(); });

  /* ---- loop ---- */
  let last=performance.now();
  function loop(now){
    const dt=Math.min(.05,(now-last)/1000); last=now;
    for(let i=anims.length-1;i>=0;i--){ const a=anims[i]; const t=Math.max(0,Math.min(1,(now-a.t0)/a.dur)); if(now<a.t0) continue;
      const k=E[a.ease](t); a.g.position.lerpVectors(a.from,a.to,k); if(a.arc) a.g.position.y+=Math.sin(Math.PI*t)*a.arc*(a.g===boardFrame?1:1);
      if(t>=1){ anims.splice(i,1); if(a.done) a.done(); cablesDirty=true; } }
    const moving=anims.length>0;
    cableObjs.forEach(o=>o.visible=!moving);
    if(cablesDirty&&!moving) rebuildCables();
    view.t.lerp(want.t,reduce?1:.12); view.h+=(want.h-view.h)*(reduce?1:.12); placeCam();
    const on=powerOn;
    { const k=tower?1:0; if(Math.abs(towerK-k)>.001){ towerK+=(k-towerK)*(reduce?1:.08); if(Math.abs(towerK-k)<.002) towerK=k;
        const a=-Math.PI/2*E.inout(towerK); rig.rotation.z=a; rig.position.set(towerPivot-towerPivot*Math.cos(a),-towerPivot*Math.sin(a),0);
        if(towerK===k) cablesDirty=true; } }
    if(on&&!reduce) for(const s of spinners) s.rotation.z+=dt*14;
    glows.forEach((m,i)=>{ const c=new THREE.Color().setHSL(((now/3000)+i*.18)%1,.85,.55); m.material.color.copy(on?c:new THREE.Color(0x3a3d42)); m.material.emissive=on?c.clone().multiplyScalar(.6):new THREE.Color(0); });
    R.render(S,cam); requestAnimationFrame(loop);
  }
  resize(); requestAnimationFrame(loop);
  return {sync,ok:true};
})();

/* UX prototype: tiles open the catalog drawer, picking a part closes it */
document.addEventListener('click',e=>{ // capture phase: runs before the catalog's own click handler re-renders the tiles
  const t=e.target.closest('.tray .tab'); if(t){ const c=t.dataset.tab; (drawerOpen&&tab===c)?closeDrawer():openDrawer(c); }
},true);
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act="add"]'); if(a&&drawerOpen){ const p=BY[a.dataset.id]; if(p&&build[p.cat]===p.id) setTimeout(closeDrawer,150); }
});
$('dClose').addEventListener('click',closeDrawer);
function deskDrawer(){ if(DESK.matches) openDrawer(tab); else { drawerOpen=false; $('drawer').classList.remove('open'); renderTabs(); } }
DESK.addEventListener('change',deskDrawer);
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&drawerOpen) closeDrawer(); });

render(); deskDrawer();
})();
</script>
</body>
